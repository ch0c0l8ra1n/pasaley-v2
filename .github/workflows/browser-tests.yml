# Runs the browser tests (tests/) in Chrome and Firefox on GitHub's Ubuntu runners.
#
# Replica: on every pull request and push to main, against recorded Daraz pages. The
# recordings are cached per day and per tests/pages.json; a job that finds none records
# them first, which needs Daraz to answer without a captcha.
#
# Live: nightly, against the real Daraz site, to catch changes there. A captcha or a
# Daraz change makes it fail, which says nothing about the code, so it never fails the
# workflow.
#
# Neither job is a required check: CI (lint and build) is. These can fail for reasons
# outside this repository.
name: Browser tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 21 * * *' # nightly
  workflow_dispatch:

permissions:
  contents: read

env:
  CHROME_PATH: /usr/bin/google-chrome
  FIREFOX_PATH: /usr/bin/firefox

jobs:
  replica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - id: today
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: recordings
        uses: actions/cache@v4
        with:
          path: tests/recordings
          key: recordings-${{ hashFiles('tests/pages.json') }}-${{ steps.today.outputs.date }}
          # Older recordings of the same pages, to test with if recording today fails.
          restore-keys: recordings-${{ hashFiles('tests/pages.json') }}-

      - name: Record today's Daraz pages
        if: steps.recordings.outputs.cache-hit != 'true'
        continue-on-error: true # Daraz may show a captcha
        run: npm run record

      - name: Check that there is something to test
        run: ls tests/recordings/*.json

      - run: npm run test:replica

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # Daraz may show a captcha or have changed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
