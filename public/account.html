<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pasaley account</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ddd; --accent: #f57224; }
@media (prefers-color-scheme: dark) { :root { --bg: #161616; --fg: #eee; --muted: #aaa; --line: #3a3a3a; } }
* { box-sizing: border-box; }
body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2 { margin: 0; }
h1 { font-size: 24px; } h2 { font-size: 18px; }
p { margin: 0; color: var(--muted); }
button { padding: 9px 14px; border: 1px solid var(--line); border-radius: 8px; background: none; color: inherit; font: inherit; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
li { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
li a { color: inherit; overflow-wrap: anywhere; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.error { color: #d33; }
[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>Pasaley</h1>
  <p id="error" class="error" role="alert" hidden></p>
  <section id="signed-out" hidden>
    <p>Sign in to get price alerts for Daraz products.</p>
    <p><button id="login" class="primary">Log in or register</button></p>
    <p>Signed in already? Allow cookies for pasaley.com in your browser settings, then reload this page.</p>
  </section>
  <section id="signed-in" hidden>
    <div class="row"><span id="email"></span><button id="logout">Log out</button></div>
  </section>
  <section id="notifications" hidden>
    <div class="row">
      <span id="notifications-status"></span>
      <button id="enable-notifications" class="primary">Turn on notifications</button>
    </div>
  </section>
  <section id="alerts-section" hidden>
    <h2>Your price alerts</h2>
    <p id="no-alerts" hidden>No alerts yet. Open a Daraz product and use the Alerts tab on the Pasaley chart.</p>
    <ul id="alerts"></ul>
  </section>
</main>
<script src="assets/account/account.js"></script>
</body>
</html>
